services:
  xray-server:
    image: teddysun/xray:latest
    container_name: xray-server
    volumes:
      - ./xray-server/config.json:/etc/xray/config.json
    networks:
      - xray-test-net
    restart: unless-stopped
    depends_on:
      - sink

  tester:
    image: ghcr.io/ivantopgaming/xrayspeedtesting:latest
    container_name: tester
    networks:
      - xray-test-net
    depends_on:
      xray-server:
        condition: service_started
      sink:
        condition: service_healthy
    environment:
      - DATA_TO_SEND_MB=102400
      - BUFFER_SIZE=65536

  sink:
    image: alpine:latest
    container_name: sink
    command: sh -c "apk add --no-cache netcat-openbsd && nc -lkp 8080 > /dev/null"
    networks:
      - xray-test-net
    healthcheck:
      # Deliberately checks the process, not the port. The sink is a
      # single-connection `nc -lkp`, so a probe connection to 8080 competes with
      # the data stream and makes the throughput test die with connection resets.
      test: ["CMD-SHELL", "pgrep -f 'nc -lkp 8080' > /dev/null"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s

networks:
  xray-test-net:
    driver: bridge
